<body>
<div id="splash" role="presentation">
  <div class="sp-mark" style="display:block;width:78px;height:78px;border-radius:17px;background:#a2352a;color:#f4f1e8;font:600 46px/76px Georgia,'Times New Roman',serif;text-align:center">E</div>
  <div class="sp-t">考研英语大作文</div>
  <div class="sp-r"></div>
  <div class="sp-s">背诵程序 · 326 张卡 · 六大方面</div>
  <div class="sp-dot"><i></i><i></i><i></i></div>
</div>
<script>
(function () {
  var sp = document.getElementById('splash');
  if (!sp) return;
  var done = false, t0 = Date.now();
  function hide() {
    if (done) return;
    var wait = 640 - (Date.now() - t0);          // 至少停留 0.64s，避免一闪而过
    if (wait > 0) return setTimeout(hide, wait);
    done = true;
    sp.className = 'gone';
    setTimeout(function () { if (sp.parentNode) sp.parentNode.removeChild(sp); }, 380);
  }
  window.__hideSplash = hide;
  function arm() {
    var app = document.getElementById('app');
    if (!app) return setTimeout(arm, 60);
    if (app.children.length) { hide(); return; }
    if (window.MutationObserver) {
      var ob = new MutationObserver(function () {
        if (app.children.length) { ob.disconnect(); hide(); }
      });
      ob.observe(app, { childList: true, subtree: true });
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arm);
  else arm();
  setTimeout(hide, 7000);
})();
</script>
<div id="app"></div>
<div id="toast" class="toast"></div>
<script>
(function () {
  var box = document.getElementById('app');
  function fail(m) { if (box) box.innerHTML = '<div class="wrap"><div class="empty">' + m + '</div></div>'; }
  function bytes(b64) {
    var bin = atob(String(b64).replace(/[^A-Za-z0-9+/=]/g, '')), n = bin.length, u = new Uint8Array(n), i;
    for (i = 0; i < n; i++) u[i] = bin.charCodeAt(i);
    return u;
  }
  function loadApp() {
    var parts = ['app-1.js', 'app-2.js'], texts = [], left = parts.length;
    function done() {
      if (left > 0) return;
      try { new Function(texts.join('\n'))(); }
      catch (e) { fail('程序没有加载成功，刷新一次页面即可'); }
    }
    parts.forEach(function (p, i) {
      var x = new XMLHttpRequest();
      x.open('GET', p, true);
      x.onload = function () { texts[i] = x.responseText; left--; done(); };
      x.onerror = function () { left--; done(); };
      x.send();
    });
  }
  if (typeof DecompressionStream !== 'function') { fail('当前浏览器不支持解压，请更新系统或换 Chrome 打开'); return; }
  var x = new XMLHttpRequest(), v = Date.now();
  x.open('GET', 'data.txt?v=' + v, true);
  x.onload = function () {
    if (x.status >= 400 || !x.responseText) { fail('数据包没取到，请连网后刷新'); return; }
    try {
      var stream = new Blob([bytes(x.responseText)]).stream().pipeThrough(new DecompressionStream('gzip'));
      new Response(stream).text().then(function (t) {
        try { new Function(t)(); } catch (e) { fail('数据解析失败：' + (e && e.message ? e.message : e)); return; }
        loadApp();
      }, function (e) { fail('数据包解压失败：' + (e && e.message ? e.message : e)); });
    } catch (e) { fail('数据包解析失败：' + (e && e.message ? e.message : e)); }
  };
  x.onerror = function () { fail('数据包没取到，请连网后刷新'); };
  x.send();
})();
</script>
