<body>
<div id="splash" role="presentation">
  <div class="sp-mark">
    <span style="width:96px;background:#a2352a"></span>
    <span style="width:86px;background:#1f1d1a"></span>
    <span style="width:66px;background:#6e675c"></span>
  </div>
  <div class="sp-t">考研英语大作文</div>
  <div class="sp-r"></div>
  <div class="sp-s">背诵程序 · 299 张卡 · 六大方面</div>
  <div class="sp-dot"><i></i><i></i><i></i></div>
</div>
<script>
(function () {
  var sp = document.getElementById('splash');
  if (!sp) return;
  var done = false, t0 = Date.now();
  function hide() {
    if (done) return;
    var wait = 640 - (Date.now() - t0);          // 至少停留 0.64s，避免一闪而过
    if (wait > 0) return setTimeout(hide, wait);
    done = true;
    sp.className = 'gone';
    setTimeout(function () { if (sp.parentNode) sp.parentNode.removeChild(sp); }, 380);
  }
  window.__hideSplash = hide;
  function arm() {
    var app = document.getElementById('app');
    if (!app) return setTimeout(arm, 60);
    if (app.children.length) { hide(); return; }
    if (window.MutationObserver) {
      var ob = new MutationObserver(function () {
        if (app.children.length) { ob.disconnect(); hide(); }
      });
      ob.observe(app, { childList: true, subtree: true });
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arm);
  else arm();
  setTimeout(hide, 7000);
})();
</script>
<div id="app"></div>
<div id="toast" class="toast"></div>
<script src="data-g.js"></script>
<script src="data-a.js"></script>
<script src="data-b1.js"></script>
<script src="data-b2.js"></script>
<script src="data-c.js"></script>
<script>
(function () {
  var parts = ['app-1.js', 'app-2.js'], texts = [], left = parts.length;
  function done() {
    if (left > 0) return;
    try { new Function(texts.join('\n'))(); }
    catch (e) {
      document.getElementById('app').innerHTML = '<div style="padding:28px 20px;font-size:15px;line-height:1.7">程序没有加载成功，刷新一次页面即可。如果一直这样，换个浏览器再打开。</div>';
    }
  }
  parts.forEach(function (p, i) {
    var x = new XMLHttpRequest();
    x.open('GET', p, true);
    x.onload = function () { texts[i] = x.responseText; left--; done(); };
    x.onerror = function () { left--; done(); };
    x.send();
  });
})();
</script>
